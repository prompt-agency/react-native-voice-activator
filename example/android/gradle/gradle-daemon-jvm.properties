# Gradle daemon JVM criteria.
#
# Pins the Gradle daemon to JDK 17, matching the java-version that ci.yml and
# release.yml provision via setup-java.
#
# This replaces the old absolute org.gradle.java.home path in gradle.properties,
# which only resolved on one machine. Gradle resolves this criteria against
# locally installed JDKs, so it works on Linux runners and on any Mac.
#
# Why it is pinned at all: on JDK 24+ native library loading from the unnamed
# module prints "WARNING: A restricted method in java.lang.System has been
# called" to stderr, and AGP fails configureCMakeDebug on that output. Without a
# pin, a machine whose default java is 24+ cannot build the native modules.
toolchainVersion=17
