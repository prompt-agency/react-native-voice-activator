name: Release Readiness

on:
  workflow_call:
    inputs:
      ios_asset_tag:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ios_asset_tag:
        description: Published tag containing checksum-matching iOS archives
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-release-surface:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Verify release readiness
        run: yarn verify:release-readiness

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Build library and Expo config plugin
        run: yarn prepare

      - name: Generate example native projects
        run: yarn workspace react-native-voice-activator-example prebuild

      - name: Build example for Android
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASSET_TAG: ${{ inputs.ios_asset_tag }}
        run: |
          asset_tag="${ASSET_TAG:-$(gh release view --json tagName --jq .tagName)}"
          if [[ ! "$asset_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Invalid Android asset tag: $asset_tag" >&2
            exit 1
          fi
          export ORG_GRADLE_PROJECT_VoiceActivator_packageVersion="${asset_tag#v}"
          yarn workspace react-native-voice-activator-example build:android

  build-ios:
    runs-on: macos-26

    env:
      XCODE_VERSION: 26.5
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Use appropriate Xcode version
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: example

      - name: Build library and Expo config plugin
        run: yarn prepare

      - name: Generate example native projects
        run: yarn workspace react-native-voice-activator-example prebuild

      - name: Select published iOS asset source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IOS_ASSET_TAG: ${{ inputs.ios_asset_tag }}
        run: |
          asset_tag="${IOS_ASSET_TAG:-$(gh release view --json tagName --jq .tagName)}"
          if [[ ! "$asset_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Invalid iOS asset tag: $asset_tag" >&2
            exit 1
          fi
          echo "VOICEACTIVATOR_SHERPA_BASE_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${asset_tag}" >> "$GITHUB_ENV"

      - name: Install cocoapods
        run: |
          cd example
          bundle exec pod repo update --verbose
          bundle exec pod install --project-directory=ios

      - name: Build example for iOS
        run: |
          yarn workspace react-native-voice-activator-example build:ios
