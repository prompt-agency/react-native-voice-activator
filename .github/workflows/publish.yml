name: Publish

# Publishes to npm when a GitHub release is published, which is the correct
# order: the release carries the vendored binaries and model assets that the
# podspec, the Gradle task and prepareModels() download, so it must exist before
# the npm version that points at it.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish from, e.g. v0.1.1'
        required: true

permissions:
  contents: read
  # Required for npm trusted publishing. This is what replaces a long-lived
  # NPM_TOKEN, and it is also what makes npm generate a provenance attestation
  # automatically, with no --provenance flag.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Deliberately NOT ./.github/actions/setup: that pins Node from .nvmrc
      # (20.19.0), and trusted publishing requires Node >= 22.14.0 with npm
      # >= 11.5.1. The rest of CI stays on the .nvmrc pin; only the publish
      # step needs the newer toolchain.
      - name: Setup Node for publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
          # npm's own guidance: never cache the package manager in a release
          # build.
          package-manager-cache: false

      # Node 22.14 ships npm 10.9, below the 11.5.1 that trusted publishing
      # needs. Pinned to the 11.x line rather than @latest: npm 12 requires Node
      # ^22.22.2 || ^24.15.0 || >=26, which this job's Node does not satisfy, so
      # @latest fails EBADENGINE. The install is itself the version check, since
      # a range that cannot resolve fails the step.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g 'npm@^11.5.1'
          npm --version

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Verify the release assets resolve before publishing
        run: yarn verify:release-assets

      # No NODE_AUTH_TOKEN and no --provenance: OIDC supplies a short-lived
      # credential, and npm attaches provenance by itself for a public repo.
      - name: Publish
        run: npm publish
