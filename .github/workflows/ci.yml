name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

      - name: Validate Expo config resolution
        run: yarn verify:expo-config-resolution

      - name: Validate Expo prebuild generation
        run: yarn verify:expo-prebuild

  # yarn lint runs verify:native-checks, but that script skips itself on
  # anything other than macOS because it needs clang and Foundation. Every
  # other job here is ubuntu-latest, so without this job the host-side
  # Objective-C++ checks never execute in CI at all. They are the only
  # regression guard for SherpaOnnxAssetLoader's root-path handling, whose
  # last bug broke the default on-demand model flow on iOS while leaving the
  # bundled-asset path the example app uses working. Compiling them needs no
  # simulator, no CocoaPods and no sherpa-onnx, so this job is seconds long.
  native-checks:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run host-side native checks
        run: yarn verify:native-checks

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

  build-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

      # tsc over a tree that contains lib/ is a different compilation than the
      # pre-build one: the emitted .d.ts files are in scope alongside their
      # sources. A duplicate-declaration regression only shows up here.
      - name: Typecheck against build output
        run: yarn typecheck

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      # The native module is the majority of this package by line count. Without
      # this job a Kotlin compile error reaches main unnoticed, because the
      # native build otherwise only runs in the manually-dispatched release
      # workflow. Compile-only: the full example APK build stays in release.yml.
      - name: Compile Android native module
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
        run: |
          cd example/android
          ./gradlew :react-native-voice-activator:compileDebugKotlin --no-daemon